name: Create Plugin Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-plugin-update
  cancel-in-progress: false

# The monthly schedule is intentionally disabled. Run this workflow manually
# after reviewing the proposed dependency/configuration update. It uses the
# short-lived repository token rather than a persistent PAT.

jobs:
  release:
    name: Create plugin update (manual)
    environment: dependency-update
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: grafana/plugin-actions/create-plugin-update@235f06405d28d2cce712543f2ad715a91fe3b32b # create-plugin-update/v2.1.0
        with:
          token: ${{ github.token }}
